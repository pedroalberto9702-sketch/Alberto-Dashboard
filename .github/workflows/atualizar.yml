# =============================================================================
#  Atualização dos dados
# =============================================================================
#  Esta rotina é o coração do projeto. Ela faz as consultas lentas ao
#  Compras.gov.br longe dos olhos de qualquer usuário e grava o resultado
#  como arquivos no próprio repositório. O site só lê esses arquivos.
#
#  Por isso a lentidão da API deixou de ser um problema: aqui existe um
#  limite de 6 horas por execução, e ninguém está esperando na frente de
#  uma tela.
#
#  Atenção a um detalhe do GitHub: rotinas agendadas são desativadas
#  automaticamente em repositórios que ficam cerca de 60 dias sem
#  movimentação. Se a atualização parar, basta reativar na aba Actions.
# =============================================================================

name: Atualizar dados

on:
  schedule:
    # horários em UTC. Cuiabá é UTC-4, então 13h/18h/23h UTC
    # correspondem a 09h/14h/19h no seu horário.
    - cron: "7 13 * * *"
    - cron: "7 18 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      uasgs:
        description: "UASGs separadas por vírgula"
        required: false
        default: "120641"
      anos:
        description: "Anos separados por vírgula (vazio = ano atual)"
        required: false
        default: ""

# impede que duas execuções gravem no repositório ao mesmo tempo
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt

      - name: Instalar dependências
        run: pip install -r coletor/requirements.txt

      - name: Coletar
        id: coleta
        continue-on-error: true
        env:
          UASGS: ${{ github.event.inputs.uasgs || vars.UASGS || '120641' }}
          ANOS: ${{ github.event.inputs.anos || vars.ANOS || '' }}
          SAIDA: site/dados
        run: python coletor/coletar.py

      # O commit acontece mesmo quando a coleta falha em parte: se uma
      # unidade deu certo e outra não, queremos publicar a que deu certo.
      - name: Publicar os dados
        run: |
          git config user.name  "rotina-de-dados"
          git config user.email "actions@github.com"
          git add site/dados
          if git diff --cached --quiet; then
            echo "Nada mudou nesta execução."
            exit 0
          fi
          git commit -m "dados: atualização de $(TZ=America/Cuiaba date '+%d/%m/%Y %H:%M')"
          # a rotina agendada pode concorrer com um commit seu; se o envio
          # falhar por isso, rebaseia e tenta de novo
          for tentativa in 1 2 3; do
            git push && exit 0
            echo "Envio falhou (tentativa $tentativa); sincronizando..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "Não foi possível enviar os dados."
          exit 1

      - name: Repassar falha da coleta
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "A coleta terminou com erro. Os dados anteriores foram mantidos."
          echo "Veja o registro da etapa 'Coletar' acima para o motivo."
          exit 1
